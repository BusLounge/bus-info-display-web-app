# Settings for run-kiosk.js. Format: key: value  (lines starting with # are ignored)

# Which computer you are on: mac or windows
os: mac

# electron = the full kiosk app (full screen, like a real kiosk)
# browser  = the sync agent plus the display page in your normal browser
mode: electron

# Lounge to display. It only shows rows if the lounge has trips today.
# loungeName must be the lounge's exact name (it is used to fetch the lounge's ads).
loungeId: dd971205-6d75-468b-98a9-f540466d3186
loungeName: Ceynaturia Longe

# Backend API the sync agent downloads from
serverUrl: http://localhost:8083

# true = rebuild kiosk-frontend into kiosk-electron-shell/www before starting (electron mode).
# The rebuilt copy is only used for this run; www is restored afterwards.
rebuildDisplay: false

# Browser mode only: open the display in your default browser
openBrowser: true
